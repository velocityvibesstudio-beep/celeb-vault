<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iconic Italy - Official Store</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Adsterra Global Scripts -->
    <script src="https://pl30761942.effectivecpmnetwork.com/c8/17/88/c81788b8748c5c0a12241805299e9328.js"></script>
    <script src="https://pl30761944.effectivecpmnetwork.com/a7/23/aa/a723aa4faaf211da9d6bd59adccc63d2.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans pb-16">

    <!-- Header -->
    <header class="sticky top-0 z-50 bg-slate-900/90 backdrop-blur-md border-b border-slate-800 px-4 py-4">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-shirt text-amber-400 animate-pulse"></i>
                <h1 class="text-base font-black tracking-wider bg-gradient-to-r from-amber-200 to-amber-500 bg-clip-text text-transparent">
                    ICONIC ITALY STORE
                </h1>
            </div>
            <a href="https://t.me/iconicitaly" target="_blank" 
               class="text-xs bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold px-3 py-1.5 rounded-full transition flex items-center gap-1 shadow-lg shadow-amber-500/20">
                <i class="fa-brands fa-telegram"></i> VIP Club
            </a>
        </div>
    </header>

    <main class="max-w-md mx-auto px-4 mt-6">
        
        <!-- Top Banner Ad -->
        <div class="bg-slate-900 border border-slate-800 rounded-xl p-2 mb-4 text-center overflow-hidden shadow-lg">
            <script>
              atOptions = { 'key' : '292388e6c887c71a96888fa0cc36941f', 'format' : 'iframe', 'height' : 90, 'width' : 728, 'params' : {} };
            </script>
            <script src="https://www.highperformanceformat.com/292388e6c887c71a96888fa0cc36941f/invoke.js"></script>
        </div>

        <!-- Promo Hero Box -->
        <div class="bg-gradient-to-r from-slate-900 to-slate-900 border border-amber-500/30 rounded-2xl p-5 mb-6 text-center shadow-xl">
            <span class="bg-amber-500/10 text-amber-400 text-[10px] font-bold px-3 py-1 rounded-full border border-amber-500/20 uppercase tracking-widest">
                Spedizione in Tutta Italia 🇮🇹
            </span>
            <h2 class="text-sm font-bold text-amber-300 mt-2 mb-1">Collezione Esclusiva Print on Demand</h2>
            <p class="text-xs text-slate-400 mb-4">Capi unici stampati su ordinazione con materiali di altissima qualità.</p>
            <a href="https://t.me/iconicitaly" target="_blank"
               class="block w-full bg-gradient-to-r from-amber-400 to-amber-500 text-slate-950 font-bold py-2.5 rounded-xl text-xs shadow-md text-center transition">
                Unisciti al Canale Telegram
            </a>
        </div>

        <!-- Products Feed Container -->
        <div id="gallery-container" class="space-y-6"></div>
        <div id="pagination-container" class="flex justify-between items-center mt-8"></div>

        <footer class="mt-12 text-center text-xs text-slate-600">
            <p>© 2026 Iconic Italy Store. Tutti i diritti riservati.</p>
        </footer>

    </main>

    <script>
        const allItems = JSON.parse('[{"title":"Limited Edition Mug","price":"€29.99","image":"https://i.ibb.co/hFZp3Bfv/Real-Photo-AI-Natural-lk-2-1786298004693.jpg","adText":"🔥 Un\'offerta imperdibile! Esclusivo design ispirato alla bellezza italiana. Qualità Premium garantita al 100%. Ordina oggi e approfitta della spedizione rapida!","checkoutLink":"https://iconic-italy.printify.me/product/30814879","rating":"4.9 ⭐ (128 Reviews)"}]');
        let currentPage = 1;
        const itemsPerPage = 10;

        function renderGallery(page) {
            const container = document.getElementById('gallery-container');
            const paginationContainer = document.getElementById('pagination-container');
            container.innerHTML = '';
            paginationContainer.innerHTML = '';

            if (!allItems || allItems.length === 0) {
                container.innerHTML = '<p class="text-center text-xs text-slate-500 py-10">Nessun prodotto disponibile al momento.</p>';
                return;
            }

            const startIndex = (page - 1) * itemsPerPage;
            const endIndex = startIndex + itemsPerPage;
            const currentItems = allItems.slice(startIndex, endIndex);

            currentItems.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = "bg-slate-900 border border-slate-800/80 rounded-2xl overflow-hidden shadow-2xl mb-6";
                
                card.innerHTML = `
                    <div class="p-3 flex justify-between items-center border-b border-slate-800/50">
                        <div>
                            <h3 class="text-sm font-bold text-slate-200">${item.title}</h3>
                            <p class="text-[10px] text-emerald-400 font-semibold">${item.rating}</p>
                        </div>
                        <span class="text-xs bg-amber-500 text-slate-950 font-black px-3 py-1 rounded-full shadow">${item.price}</span>
                    </div>

                    <div class="relative aspect-[4/5] bg-slate-950">
                        <img src="${item.image}" alt="${item.title}" class="w-full h-full object-cover">
                    </div>

                    <!-- Italian Product Ad / Copy -->
                    <div class="p-4 bg-slate-900/50 border-t border-slate-800/50">
                        <p class="text-xs text-slate-200 leading-relaxed font-medium">
                            ${item.adText}
                        </p>
                    </div>

                    <!-- Ads Section -->
                    <div class="ad-wrapper-${index} p-3 bg-slate-950/50 border-t border-slate-800/50 text-center overflow-hidden space-y-4">
                        <span class="text-[9px] text-slate-500 uppercase tracking-widest block mb-1">Sponsored Advertisement</span>
                    </div>

                    <div class="p-4 pt-0">
                        <a href="${item.checkoutLink}" target="_blank"
                           class="w-full flex items-center justify-center gap-2 bg-gradient-to-r from-amber-400 to-amber-500 text-slate-950 font-black py-3 rounded-xl text-xs shadow-lg shadow-amber-500/20 hover:opacity-95 transition">
                            <i class="fa-solid fa-cart-shopping">></i> ACQUISTA ORA / COMPRA (Buy Now)
                        </a>
                    </div>
                `;

                container.appendChild(card);

                const adContainer = card.querySelector(`.ad-wrapper-${index}`);
                
                // Native Ad
                const nativeDiv = document.createElement('div');
                nativeDiv.id = 'container-2d08a49360bea68cb6fef1b2954d6af5-' + index;
                adContainer.appendChild(nativeDiv);

                const nativeScript = document.createElement('script');
                nativeScript.async = true;
                nativeScript.dataset.cfasync = "false";
                nativeScript.src = "https://pl30761943.effectivecpmnetwork.com/2d08a49360bea68cb6fef1b2954d6af5/invoke.js";
                adContainer.appendChild(nativeScript);

                // Banner 468x60
                const bannerScript1 = document.createElement('script');
                bannerScript1.innerHTML = "atOptions = { 'key' : '528c2baaa775a51f30609ead9051f321', 'format' : 'iframe', 'height' : 60, 'width' : 468, 'params' : {} };";
                adContainer.appendChild(bannerScript1);

                const bannerInvoke1 = document.createElement('script');
                bannerInvoke1.src = "https://www.highperformanceformat.com/528c2baaa775a51f30609ead9051f321/invoke.js";
                adContainer.appendChild(bannerInvoke1);
            });

            const totalPages = Math.ceil(allItems.length / itemsPerPage);
            if (totalPages > 1) {
                let paginationHtml = '';
                if (page > 1) {
                    paginationHtml += `<button onclick="changePage(${page - 1})" class="bg-slate-800 text-amber-400 px-4 py-2 rounded-xl text-xs font-bold">Indietro (Prev)</button>`;
                } else {
                    paginationHtml += `<div></div>`;
                }
                paginationHtml += `<span class="text-xs text-slate-400">Pagina ${page} di ${totalPages}</span>`;
                if (page < totalPages) {
                    paginationHtml += `<button onclick="changePage(${page + 1})" class="bg-amber-500 text-slate-950 px-4 py-2 rounded-xl text-xs font-bold">Avanti (Next) ➔</button>`;
                } else {
                    paginationHtml += `<div></div>`;
                }
                paginationContainer.innerHTML = paginationHtml;
            }
        }

        window.changePage = function(newPage) {
            currentPage = newPage;
            renderGallery(currentPage);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        renderGallery(currentPage);
    </script>
</body>
</html>
