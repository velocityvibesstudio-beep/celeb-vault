</head>
<body class="bg-slate-950 text-slate-100 font-sans pb-16">

               class="text-xs bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold px-3.5 py-1.5 rounded-full transition flex items-center gap-1 shadow-lg shadow-amber-500/20">

            </a>

    </header>

    <main class="max-w-md mx-auto px-4 mt-6">
        
        <div class="bg-gradient-to-r from-slate-900 to-slate-900 border border-amber-500/30 rounded-2xl p-5 mb-6 text-center shadow-xl">
            <h2 class="text-base font-bold text-amber-300 mb-1">Exclusive HD Edits & Wallpapers</h2>
            <p class="text-xs text-slate-400 mb-4">Get high-resolution, AI-crafted collections daily straight to your phone.</p>
            <a href="https://t.me/iconicitaly" target="_blank"
               class="block w-full bg-gradient-to-r from-amber-400 to-amber-500 text-slate-950 font-bold py-2.5 rounded-xl text-sm shadow-md text-center transition">
                Access Full Gallery (Free)
            </a>
        </div>

        <div id="gallery-container" class="space-y-6"></div>
        <div id="pagination-container" class="flex justify-between items-center mt-8"></div>

        <footer class="mt-12 text-center text-xs text-slate-600">
            <p>© 2026 Iconic Vault. Built for Creators.</p>
        </footer>

    </main>

    <script>
        const allItems = JSON.parse('[{"name":"Giorgia Meloni","category":"Exclusive AI Art","image":"https://i.ibb.co/ybkG3k3/Real-Photo-AI-Natural-lk-2-1786193093912.jpg","quote":"The future belongs to those who believe in the beauty of their dreams.","likes":"19.7K"}]');
        let currentPage = 1;
        const itemsPerPage = 10;

        function renderGallery(page) {
            const container = document.getElementById('gallery-container');
            const paginationContainer = document.getElementById('pagination-container');
            container.innerHTML = '';
            paginationContainer.innerHTML = '';

            if (!allItems || allItems.length === 0) {
                container.innerHTML = '<p class="text-center text-xs text-slate-500 py-10">No items available yet.</p>';
                return;
            }

            const startIndex = (page - 1) * itemsPerPage;
            const endIndex = startIndex + itemsPerPage;
            const currentItems = allItems.slice(startIndex, endIndex);

            let htmlContent = '';
            currentItems.forEach((item, index) => {
                htmlContent += `
                <div class="bg-slate-900 border border-slate-800/80 rounded-2xl overflow-hidden shadow-2xl mb-6">
                    <div class="p-3 flex justify-between items-center border-b border-slate-800/50">
                        <div>
                            <h3 class="text-sm font-bold text-slate-200">${item.name}</h3>
                            <p class="text-[10px] text-amber-400/80">${item.category}</p>
                        </div>
                        <span class="text-[10px] bg-slate-800 text-slate-400 px-2 py-0.5 rounded">HD 4K</span>
                    </div>
                    <div class="relative aspect-[4/5] bg-slate-950">
                        <img src="${item.image}" alt="${item.name}" class="w-full h-full object-cover">
                    </div>

                    <!-- All Adsterra Ads Section -->
                    <div class="p-3 bg-slate-950/50 border-t border-slate-800/50 text-center overflow-hidden space-y-4">
                        <span class="text-[9px] text-slate-500 uppercase tracking-widest block mb-1">Sponsored Advertisement</span>
                        
                        <!-- Native Ad -->
                        <div id="container-fe5f4fbac7e244bfba28b021f78791ca"></div>
                        <script async="async" data-cfasync="false" src="https://pl30756049.effectivecpmnetwork.com/fe5f4fbac7e244bfba28b021f78791ca/invoke.js"><\/script>

                        <!-- Banner 468x60 -->
                        <script>
                          atOptions = { 'key' : '5eef6bf59d652fd2e01a6fa072b6b72f', 'format' : 'iframe', 'height' : 60, 'width' : 468, 'params' : {} };
                        <\/script>
                        <script src="https://www.highperformanceformat.com/5eef6bf59d652fd2e01a6fa072b6b72f/invoke.js"><\/script>

                        <!-- Banner 300x250 -->
                        <script>
                          atOptions = { 'key' : 'c5a82f4ee955933433b39736ef7dbe7f', 'format' : 'iframe', 'height' : 250, 'width' : 300, 'params' : {} };
                        <\/script>
                        <script src="https://www.highperformanceformat.com/c5a82f4ee955933433b39736ef7dbe7f/invoke.js"><\/script>

                        <!-- Banner 300x160 -->
                        <script>
                          atOptions = { 'key' : '0df98a9b04db31b08879bb82f0d18576', 'format' : 'iframe', 'height' : 300, 'width' : 160, 'params' : {} };
                        <\/script>
                        <script src="https://www.highperformanceformat.com/0df98a9b04db31b08879bb82f0d18576/invoke.js"><\/script>

                        <!-- Banner 600x160 -->
                        <script>
                          atOptions = { 'key' : 'ff3516ec78497f1ed24d8f6cd3bccbb6', 'format' : 'iframe', 'height' : 600, 'width' : 160, 'params' : {} };
                        <\/script>
                        <script src="https://www.highperformanceformat.com/ff3516ec78497f1ed24d8f6cd3bccbb6/invoke.js"><\/script>

                        <!-- Banner 320x50 -->
                        <script>
                          atOptions = { 'key' : '748ce4846c787d9f5a3f572363503ec2', 'format' : 'iframe', 'height' : 50, 'width' : 320, 'params' : {} };
                        <\/script>
                        <script src="https://www.highperformanceformat.com/748ce4846c787d9f5a3f572363503ec2/invoke.js"><\/script>

                        <!-- Banner 728x90 -->
                        <script>
                          atOptions = { 'key' : 'a8ed5b14c3177bfc6b62e6f3621b5e2a', 'format' : 'iframe', 'height' : 90, 'width' : 728, 'params' : {} };
                        <\/script>
                        <script src="https://www.highperformanceformat.com/a8ed5b14c3177bfc6b62e6f3621b5e2a/invoke.js"><\/script>
                    </div>

                    <div class="p-4">
                        <p class="text-xs text-slate-300 italic mb-4 leading-relaxed">
                            "${item.quote}"
                        </p>
                        <div class="flex justify-between items-center pt-2 border-t border-slate-800/80">
                            <div class="flex items-center gap-1 text-xs text-slate-400">
                                <i class="fa-solid fa-heart text-rose-500"></i>
                                <span>${item.likes}</span>
                            </div>
                            <a href="${item.image}" download="IconicItaly-${index}.jpg" target="_blank"
                               class="flex items-center gap-1 bg-amber-500/10 hover:bg-amber-500/20 text-amber-400 px-3 py-1.5 rounded-lg text-xs font-medium border border-amber-500/20 transition">
                                <i class="fa-solid fa-download"></i> Save HD
                            </a>
                        </div>
                    </div>
                </div>`;
            });

            container.innerHTML = htmlContent;

            const totalPages = Math.ceil(allItems.length / itemsPerPage);
            if (totalPages > 1) {
                let paginationHtml = '';
                if (page > 1) {
                    paginationHtml += `<button onclick="changePage(${page - 1})" class="bg-slate-800 text-amber-400 px-4 py-2 rounded-xl text-xs font-bold">Previous</button>`;
                } else {
                    paginationHtml += `<div></div>`;
                }
                paginationHtml += `<span class="text-xs text-slate-400">Page ${page} of ${totalPages}</span>`;
                if (page < totalPages) {
                    paginationHtml += `<button onclick="changePage(${page + 1})" class="bg-amber-500 text-slate-950 px-4 py-2 rounded-xl text-xs font-bold">Next Page ➔</button>`;
                } else {
                    paginationHtml += `<div></div>`;
                }
                paginationContainer.innerHTML = paginationHtml;
            }
        }

        window.changePage = function(newPage) {
            currentPage = newPage;
            renderGallery(currentPage);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        renderGallery(currentPage);
    </script>
</body>
</html>
